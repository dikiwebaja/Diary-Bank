    <main class="section-container">

            <form id="contactForm">
                <input type="hidden" name="access_key" value="3f422e90-6e23-4f5a-843c-b20ae85ed991">
                <input type="hidden" name="subject" value="💼 [PROJEK/KERJASAMA] Ada Penawaran Baru di Web Aneh!">
                <input type="hidden" name="from_name" value="Business Router Engine">

                <div class="form-group" style="margin-bottom: 15px;">
                    <label class="form-label"><i class="fas fa-user accent-purple"></i> Nama :</label>
                    <input type="text" name="Nama_Klien_atau_Brand" class="custom-input" placeholder="Contoh: Nama / Anonim" required>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label class="form-label"><i class="fas fa-envelope accent-purple"></i> Email Saya :</label>
                    <input type="email" name="Email_Klien" class="custom-input" placeholder="nama@email.com" required>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label class="form-label"><i class="fas fa-file-alt accent-purple"></i> Detail Masalah :</label>
                    <textarea name="Brief_Detail_Projek" class="custom-input" placeholder="Jelaskan detail masalah dan apa yang bisa kami bantu" required></textarea>
                    <small class="file-hint">*Setelah menekan tombol kirim, kamu akan diarahkan ke Google Drive jika ingin mengunggah foto bukti.</small>
                </div>

                <button type="submit" id="btnSubmit" class="btn-submit-neon">
                    Kirim & Upload Bukti <i class="fas fa-paper-plane"></i>

    <script>
        const form = document.getElementById('contactForm');
        const resultMsg = document.getElementById('result-message');
        const btnSubmit = document.getElementById('btnSubmit');

        // Ganti link di bawah ini dengan link folder Google Drive kamu
        const gdriveFolderUrl = "https://drive.google.com/drive/folders/1eS7GT1Zbf9f402NEmmZhrAYKMDyosTS8";

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = 'Sending... <i class="fas fa-spinner fa-spin"></i>';
            resultMsg.style.display = 'none';

            const formData = new FormData(form);

            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                body: formData
            })
            .then(async (response) => {
                let json = await response.json();
                if (response.status == 200) {
                    showStatus('Pesan berhasil terkirim! Membuka Google Drive...', true);
                    form.reset();
                    
                    // Redirect otomatis ke Google Drive di tab baru setelah 1.5 detik
                    setTimeout(() => {
                        window.open(gdriveFolderUrl, '_blank');
                    }, 1500);
                } else {
                    showStatus(json.message || 'Gagal mengirim pesan, coba lagi nanti.', false);
                }
            })
            .catch(error => {
                showStatus('Terjadi kesalahan jaringan atau koneksi.', false);
            })
            .finally(() => {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = 'Kirim & Upload Bukti <i class="fas fa-paper-plane"></i>';
            });
        });

        function showStatus(text, isSuccess) {
            resultMsg.innerText = text;
            resultMsg.className = isSuccess ? 'status-success' : 'status-error';
            resultMsg.style.display = 'block';
        }
    </script>
